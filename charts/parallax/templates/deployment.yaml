apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parallax.fullname" . }}
  labels:
    {{- include "parallax.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "parallax.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "parallax.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "parallax.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --leader-elect={{ .Values.operator.leaderElection }}
        - --metrics-bind-address={{ .Values.operator.metricsAddr }}
        - --metrics-secure={{ .Values.metrics.secure | default false }}
        - --health-probe-bind-address={{ .Values.operator.healthProbeAddr }}
        - --zap-log-level={{ .Values.operator.logLevel }}
        {{- if eq .Values.operator.logFormat "development" }}
        - --zap-devel=true
        {{- end }}
        env:
        - name: LOG_LEVEL
          value: {{ .Values.operator.logLevel | quote }}
        {{- if .Values.operator.profiling.enabled }}
        - name: ENABLE_PPROF
          value: "true"
        - name: PPROF_BIND_ADDRESS
          value: {{ .Values.operator.profiling.bindAddress | quote }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        {{- if .Values.operator.profiling.enabled }}
        - name: pprof
          containerPort: 6060
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }} 