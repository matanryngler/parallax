apiVersion: batchops.io/v1alpha1
kind: ListJob
metadata:
  name: order-processor
  labels:
    example: postgres-etl
spec:
  # Reference the PostgreSQL-based ListSource
  listSourceRef: postgres-orders

  # Run up to 3 jobs in parallel
  parallelism: 3

  # Job template
  template:
    image: postgres:16-alpine

    command:
      - sh
      - -c
      - |
        set -e

        echo "========================================="
        echo "Processing order ID: $ORDER_ID"
        echo "Job index: $JOB_COMPLETION_INDEX"
        echo "========================================="

        # Step 1: Fetch order details from database
        echo "Step 1: Fetching order details..."
        ORDER_DATA=$(PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -t -c \
          "SELECT customer, status FROM orders WHERE order_id = $ORDER_ID")

        if [ -z "$ORDER_DATA" ]; then
          echo "Error: Order $ORDER_ID not found"
          exit 1
        fi

        echo "Order data: $ORDER_DATA"

        # Step 2: Process the order
        echo "Step 2: Processing order..."
        sleep 3

        # Step 3: Update order status in database
        echo "Step 3: Updating order status..."
        PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c \
          "UPDATE orders SET status = 'processed' WHERE order_id = $ORDER_ID"

        # Step 4: Verify update
        NEW_STATUS=$(PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -t -c \
          "SELECT status FROM orders WHERE order_id = $ORDER_ID")

        echo "New status: $NEW_STATUS"

        if echo "$NEW_STATUS" | grep -q "processed"; then
          echo "✓ Successfully processed order: $ORDER_ID"
        else
          echo "✗ Failed to update order status"
          exit 1
        fi

        echo "========================================="

    envName: ORDER_ID

    env:
      - name: DB_HOST
        value: "postgres"
      - name: DB_PORT
        value: "5432"
      - name: DB_NAME
        value: "testdb"
      - name: DB_USER
        value: "postgres"
      - name: DB_PASSWORD
        value: "postgres"
      - name: JOB_COMPLETION_INDEX
        value: "$(JOB_COMPLETION_INDEX)"

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL to be ready..."
            until PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c '\q' 2>/dev/null; do
              echo "PostgreSQL is unavailable - sleeping"
              sleep 2
            done
            echo "✓ PostgreSQL is ready"
        env:
          - name: DB_HOST
            value: "postgres"
          - name: DB_USER
            value: "postgres"
          - name: DB_PASSWORD
            value: "postgres"
          - name: DB_NAME
            value: "testdb"

  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  activeDeadlineSeconds: 1800
