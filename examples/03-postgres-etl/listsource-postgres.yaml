apiVersion: batchops.io/v1alpha1
kind: ListSource
metadata:
  name: postgres-orders
  labels:
    example: postgres-etl
spec:
  # Type: postgresql (query database)
  type: postgresql

  # PostgreSQL configuration
  postgres:
    # Connection string using libpq format
    # Format: postgresql://username:password@host:port/database?options
    #
    # IMPORTANT: This is a test example with demo credentials.
    # For production, use Auth field with secrets instead of embedding credentials in URL.
    # See the README.md for instructions on using Auth with secretRef
    connectionString: "postgresql://postgres:postgres@postgres:5432/testdb?sslmode=disable"

    # SQL query to fetch items
    # This query selects pending orders
    # Only one column should be selected as it will be used as the item list
    query: "SELECT order_id FROM orders WHERE status = 'pending' ORDER BY created_at"

  # Refresh interval in seconds
  # The database will be queried every 60 seconds to fetch new pending orders
  # Set to 0 to query only once
  intervalSeconds: 60
